name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Tests / PHP ${{ matrix.php }} / ${{ matrix.dependencies }} deps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # PHP has no LTS designation. Cover every upstream-supported branch:
        # 8.2/8.3 are security-only and 8.4/8.5 are actively supported.
        # This mirrors composer.json "php": "^8.2".
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest
          - php: '8.5'
            dependencies: lowest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:2.10.2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run unit tests
        run: composer test

  static-analysis:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: json, mbstring
          coverage: none
          tools: composer:2.10.2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      # --memory-limit: PHPStan's parallel workers exceed PHP's default 128M on this codebase.
      - name: Run PHPStan
        run: composer run phpstan -- --error-format=github

  coding-standards:
    name: Coding standards (PSR-12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: json, mbstring
          coverage: none
          tools: composer:2.10.2, cs2pr

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: Run PHPCS
        shell: bash
        run: vendor/bin/phpcs --report=checkstyle -q | cs2pr

  composer-validate:
    name: Validate composer.json
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: json, mbstring
          coverage: none
          tools: composer:2.10.2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: json, mbstring
          coverage: none
          tools: composer:2.10.2

      - name: Install highest allowed dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest

      - name: Audit dependencies
        run: composer run audit:dependencies

  coverage:
    name: Unit test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP with PCOV
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: json, mbstring
          coverage: pcov
          tools: composer:2.10.2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest

      - name: Run unit tests with coverage
        run: composer run test -- --coverage-text

  runtime-smoke:
    name: Production dependency smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: json, mbstring
          coverage: none
          tools: composer:2.10.2

      - name: Install runtime dependencies only
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          dependency-versions: highest
          composer-options: --no-dev --classmap-authoritative

      - name: Check runtime platform requirements
        run: composer check-platform-reqs --no-dev

      - name: Construct the default client without making a request
        run: |
          # PHP variables must not be expanded by the shell.
          # shellcheck disable=SC2016
          php -r 'require "vendor/autoload.php"; $client = \Assinafy\SDK\AssinafyClient::create("runtime-smoke-key", "runtime-smoke-account", \Assinafy\SDK\Configuration::SANDBOX_BASE_URL); if (!($client->getHttpClient() instanceof \Assinafy\SDK\Http\GuzzleHttpClient)) { exit(1); }'

  docker-build:
    name: Docker development image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build PHP image
        run: docker compose build php

  release-packages:
    name: GitHub release packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - tests
      - static-analysis
      - coding-standards
      - composer-validate
      - security-audit
      - coverage
      - runtime-smoke
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and verify versioned archives
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          grep -Fqx "    public const SDK_VERSION = '${version}';" src/Configuration.php
          package="assinafy-php-sdk-${version}"

          git archive --format=zip --prefix="${package}/" --output="${package}.zip" HEAD
          git archive --format=tar.gz --prefix="${package}/" --output="${package}.tar.gz" HEAD
          sha256sum "${package}.zip" "${package}.tar.gz" > "${package}.sha256"

          mkdir package-check
          tar -xzf "${package}.tar.gz" -C package-check
          test -f "package-check/${package}/composer.json"
          test -f "package-check/${package}/src/Configuration.php"
          test ! -e "package-check/${package}/AGENTS.md"
          test ! -e "package-check/${package}/CLAUDE.md"
          unzip -tq "${package}.zip"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          package="assinafy-php-sdk-${version}"
          assets=("${package}.zip" "${package}.tar.gz" "${package}.sha256")

          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}"
          fi
