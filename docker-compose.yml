services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    user: "${ASSINAFY_DOCKER_UID:-1000}:${ASSINAFY_DOCKER_GID:-1000}"
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - assinafy-network

  nginx:
    image: nginx:1.31.4-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - assinafy-network
    depends_on:
      - php

networks:
  assinafy-network:
    driver: bridge
