services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: assinafy-sdk-php
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - assinafy-network

  nginx:
    image: nginx:1.30.4-alpine
    container_name: assinafy-sdk-nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - assinafy-network
    depends_on:
      - php

networks:
  assinafy-network:
    driver: bridge
